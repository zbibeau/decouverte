<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prototype Manager — Studio dark (Direction C)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* vraies polices du front MadeForMed */
@font-face{font-family:"Steradian";src:url("fonts/steradian-lt-webfont.woff2") format("woff2");font-weight:300;font-style:normal;font-display:swap;}
@font-face{font-family:"Steradian";src:url("fonts/steradian-rg-webfont.woff2") format("woff2");font-weight:400;font-style:normal;font-display:swap;}
@font-face{font-family:"Steradian";src:url("fonts/steradian-md-webfont.woff2") format("woff2");font-weight:500;font-style:normal;font-display:swap;}
@font-face{font-family:"Steradian";src:url("fonts/steradian-bd-webfont.woff2") format("woff2");font-weight:700;font-style:normal;font-display:swap;}
@font-face{font-family:"MadeForMed";src:url("fonts/madeformed-webfont.woff2") format("woff2");font-weight:400;font-style:normal;font-display:swap;}

:root{
  --accent:#b388ff;
  --graphite:#0e1117; --g2:#161b24; --g3:#1d242f; --gline:#262d39; --gline2:#323b49;
  --gtext:#d3d9e3; --gmut:#8b94a3; --gfaint:#5d6675;
  --violet:#822eef; --violet-700:#6e1ed2; --violet-900:#4e198a; --primary-500:#9951fb;
  --ocre:#c48000; --ocre-weak:#ffedd6;
  --ff-d:"Space Grotesk",system-ui,sans-serif; --ff-b:"Hanken Grotesk",system-ui,sans-serif; --ff-m:"JetBrains Mono",monospace;
  --ff-front:"Steradian","Hanken Grotesk",system-ui,sans-serif;
  --blkpad:15px; --stackgap:11px;
}
*{box-sizing:border-box;}
html,body{height:100%;margin:0;}
body{background:var(--graphite);color:var(--gtext);font-family:var(--ff-b);font-size:15px;-webkit-font-smoothing:antialiased;overflow:hidden;}
button{font-family:inherit;cursor:pointer;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:#2c3543;border-radius:8px;border:2px solid var(--graphite);}
::-webkit-scrollbar-track{background:transparent;}

.density-compact{--blkpad:11px;--stackgap:8px;}
.density-comfy{--blkpad:19px;--stackgap:15px;}

.studio{display:grid;grid-template-columns:210px minmax(0,1fr) 360px;height:100vh;}
.studio.no-device{grid-template-columns:210px minmax(0,1fr);}

/* rail */
.rail{background:#0a0c11;border-right:1px solid var(--gline);display:flex;flex-direction:column;}
.rail-top{height:50px;display:flex;align-items:center;gap:9px;padding:0 15px;border-bottom:1px solid var(--gline);}
.rail-sq{width:25px;height:25px;border-radius:7px;background:var(--violet);color:#fff;display:grid;place-items:center;font-family:var(--ff-d);font-weight:700;font-size:13px;}
.rail-word{font-family:var(--ff-d);font-weight:600;font-size:14px;color:#fff;}
.rail-sec{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--gfaint);padding:18px 15px 7px;font-family:var(--ff-m);}
.rail-item{display:flex;align-items:center;gap:10px;padding:8px 15px;color:var(--gtext);font-size:13.5px;position:relative;cursor:pointer;}
.rail-item:hover{background:rgba(255,255,255,.04);}
.rail-item.active{background:rgba(140,90,235,.18);color:#fff;}
.rail-item.active::before{content:"";position:absolute;left:0;top:50%;transform:translateY(-50%);width:3px;height:18px;background:var(--accent);border-radius:0 3px 3px 0;}
.rail-dot{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-weight:600;font-size:11px;color:#181b22;flex-shrink:0;}
.rail-foot{margin-top:auto;padding:14px 15px;border-top:1px solid var(--gline);font-size:11px;color:var(--gfaint);font-family:var(--ff-m);}

/* canvas */
.canvas{display:flex;flex-direction:column;min-width:0;background:radial-gradient(120% 80% at 50% -10%, #131925 0%, var(--graphite) 60%);}
.topbar{height:64px;display:flex;align-items:center;gap:14px;padding:0 26px;border-bottom:1px solid var(--gline);}
.tb-title{font-family:var(--ff-d);font-weight:600;font-size:17px;color:#fff;white-space:nowrap;}
.tb-sep{color:var(--gfaint);margin:0 2px;}
.cmd-pill{margin-left:auto;background:var(--g2);border:1px solid var(--gline2);border-radius:10px;padding:8px 13px;font-size:12.5px;color:var(--gmut);display:flex;align-items:center;gap:10px;}
.cmd-pill:hover{border-color:var(--accent);color:var(--gtext);}
.kbd{font-family:var(--ff-m);font-size:10px;background:#0a0c11;border:1px solid var(--gline2);border-radius:5px;padding:2px 6px;color:var(--gtext);}
.btn-add{background:var(--violet-700);color:#fff;border:0;border-radius:10px;padding:9px 15px;font-size:13px;font-weight:600;box-shadow:0 8px 22px -10px rgba(130,46,239,.8);}
.btn-add:hover{background:var(--violet);}
.stack{flex:1;overflow-y:auto;padding:22px 26px 80px;display:flex;flex-direction:column;gap:var(--stackgap);}

/* block card */
.blk{position:relative;background:var(--g2);border:1px solid var(--gline);border-radius:13px;transition:border-color .15s, box-shadow .15s, background .15s, opacity .15s;}
.blk-nested{background:var(--g3);border-radius:10px;}
.blk.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent), 0 0 38px -12px var(--accent);}
.blk.added{animation:pop .5s ease;border-color:var(--accent);}
.blk.dragging{opacity:.4;}
.blk.drop-before::after,.blk.drop-after::after{content:"";position:absolute;left:10px;right:10px;height:3px;background:var(--accent);border-radius:3px;box-shadow:0 0 10px var(--accent);}
.blk.drop-before::after{top:-6px;}
.blk.drop-after::after{bottom:-6px;}
@keyframes pop{0%{transform:scale(.97);opacity:.4;}100%{transform:scale(1);opacity:1;}}
.blk-head{display:flex;align-items:center;gap:10px;padding:var(--blkpad);cursor:pointer;}
.blk-grip{color:var(--gfaint);font-size:13px;cursor:grab;padding:2px;flex-shrink:0;}
.blk-grip:active{cursor:grabbing;}
.blk-chev{background:transparent;border:0;color:var(--gmut);font-size:12px;width:14px;flex-shrink:0;padding:0;}
.blk-chev:hover{color:#fff;}
.blk-thumb{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#9951fb,#6e1ed2);display:grid;place-items:center;font-size:15px;color:#fff;flex-shrink:0;box-shadow:0 4px 14px -6px rgba(130,46,239,.7);}
.blk-nested .blk-thumb{width:28px;height:28px;border-radius:8px;font-size:13px;background:linear-gradient(135deg,#7d5bd6,#5a2bb0);}
.blk-meta{display:flex;flex-direction:column;min-width:0;flex:1;}
.blk-eyebrow{font-family:var(--ff-m);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);}
.blk-title{font-size:15px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500;}
.blk-nested .blk-title{font-size:13.5px;}
.blk-actions{display:flex;align-items:center;gap:2px;flex-shrink:0;}
.icbtn{background:transparent;border:0;color:var(--gmut);width:26px;height:26px;border-radius:7px;font-size:13px;display:grid;place-items:center;}
.icbtn:hover:not(:disabled){background:rgba(255,255,255,.07);color:#fff;}
.icbtn:disabled{opacity:.28;cursor:default;}
.icbtn.danger:hover{background:rgba(229,39,29,.16);color:#ff8a82;}
.blk-body{padding:0 var(--blkpad) var(--blkpad) calc(var(--blkpad) + 24px);display:flex;flex-direction:column;gap:13px;}

/* fields */
.fld{display:flex;flex-direction:column;gap:5px;}
.fld-l{font-size:11px;color:var(--gmut);font-family:var(--ff-m);letter-spacing:.04em;}
.fld-in{background:#0c0f15;border:1px solid var(--gline2);border-radius:8px;padding:8px 11px;font-size:13.5px;color:#fff;font-family:var(--ff-b);width:100%;}
.fld-in:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(179,136,255,.18);}
.fld-in.mono{font-family:var(--ff-m);}
select.fld-in{appearance:none;cursor:pointer;}
.fld-area{resize:vertical;line-height:1.5;}
.listin{display:flex;flex-direction:column;gap:6px;}
.listin-row{display:flex;gap:6px;align-items:center;border-radius:8px;transition:box-shadow .15s, opacity .15s;}
.listin-row.dragging{opacity:.4;}
.listin-row.over{box-shadow:inset 0 0 0 1px var(--accent), 10px 0 22px -8px var(--accent);}
.listin-grip{color:var(--gfaint);cursor:grab;font-size:13px;padding:0 3px;flex-shrink:0;transition:color .15s, text-shadow .15s;}
.listin-grip:hover{color:var(--accent);text-shadow:0 0 10px var(--accent), 0 0 4px var(--accent);}
.listin-grip:active{cursor:grabbing;}
.listin-add{align-self:flex-start;background:transparent;border:1px dashed var(--gline2);color:var(--accent);border-radius:8px;padding:6px 11px;font-size:12px;font-weight:600;}
.listin-add:hover{background:rgba(179,136,255,.08);}

/* condition builder */
.condbox{display:flex;flex-direction:column;gap:11px;}
.cond-grid{display:grid;grid-template-columns:1.4fr .8fr 1.2fr;gap:8px;}
.branch-toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#0c0f15;border:1px solid var(--gline2);border-radius:10px;padding:8px 11px;}
.bt-l{font-size:11px;color:var(--gmut);font-family:var(--ff-m);}
.seg{display:flex;background:#05070a;border-radius:8px;padding:2px;}
.seg button{background:transparent;border:0;color:var(--gmut);padding:5px 13px;border-radius:6px;font-size:12px;font-weight:600;}
.seg button.on{background:var(--accent);color:#1a1030;}

/* sub-zone */
.subzone{border:1px solid var(--gline);border-radius:11px;background:#0c0f15;padding:12px;display:flex;flex-direction:column;gap:var(--stackgap);}
.subzone-h{font-family:var(--ff-m);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--gfaint);}
.sub-empty{font-size:12.5px;color:var(--gfaint);padding:10px;text-align:center;border:1px dashed var(--gline2);border-radius:9px;}
.add-sub{align-self:stretch;background:rgba(179,136,255,.08);border:1px dashed #4a3a6b;color:#cbb0ff;border-radius:9px;padding:9px;font-size:12.5px;font-weight:600;}
.add-sub:hover{background:rgba(179,136,255,.16);}
.stack-add{align-self:center;margin-top:8px;background:transparent;border:1px dashed var(--gline2);color:var(--gmut);border-radius:10px;padding:11px 18px;font-size:13px;}
.stack-add:hover{border-color:var(--accent);color:var(--accent);}

/* ---------- device ---------- */
.device{background:#0a0c11;border-left:1px solid var(--gline);padding:20px;display:flex;flex-direction:column;min-width:0;}
.device-label{font-family:var(--ff-m);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--gmut);display:flex;align-items:center;gap:8px;margin-bottom:14px;}
.live-dot{width:8px;height:8px;border-radius:50%;background:#3ad07a;box-shadow:0 0 0 3px rgba(58,208,122,.2);animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.4;}}
.phone{flex:1;border-radius:26px;border:7px solid #05070a;background:#000;overflow:hidden;position:relative;box-shadow:0 30px 60px -20px rgba(0,0,0,.8), 0 0 0 1px var(--gline);min-height:0;}
.phone-notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:90px;height:18px;background:#05070a;border-radius:0 0 12px 12px;z-index:5;}
.device-hint{margin-top:13px;font-size:11.5px;color:var(--gmut);line-height:1.45;}
.device-hint b{color:var(--accent);}

/* ---------- front render (FIDÈLE) ---------- */
.pv-scroll{height:100%;overflow-y:auto;background:#fbf5ea;padding:30px 15px 36px;scroll-behavior:smooth;font-family:var(--ff-front);}
.pv-scroll::-webkit-scrollbar{width:0;}
.pv-eyebrow{font-family:var(--ff-m);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:#9a8fb0;text-align:center;margin-bottom:16px;}
.pv-block{margin-bottom:15px;border-radius:16px;}
.pv-block.pv-sel{outline:2px solid var(--violet);outline-offset:3px;}
/* hero — purple-400 + badge primary-900 */
.pv-hero{background:#c084fc;border-radius:20px;text-align:center;padding:30px 16px 34px;}
.pv-hero-badge{width:54px;height:54px;border-radius:13px;background:var(--violet-900);color:#fff;transform:rotate(-4deg);display:grid;place-items:center;font-weight:500;font-size:26px;margin:0 auto 16px;}
.pv-hero-title{font-weight:500;font-size:27px;color:#fff;line-height:1.05;}
/* text on cream */
.pv-text{color:#2d3e4d;font-size:14.5px;line-height:1.55;padding:2px 6px;}
/* white card rounded-3xl */
.pv-card-white{background:#fff;border-radius:22px;padding:18px;box-shadow:0 12px 30px -18px rgba(60,30,110,.4);color:#2d3e4d;}
.pv-card-head{display:flex;align-items:center;gap:9px;margin-bottom:10px;}
.pv-ico{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;font-size:13px;flex-shrink:0;}
.pv-ico-ocre{background:#ffedd6;color:var(--ocre);}
.pv-card-eyebrow{font-weight:500;font-size:15px;color:#2d3e4d;}
.pv-card-title2{font-weight:700;font-size:15px;margin-bottom:8px;color:#241a33;}
.pv-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;}
.pv-li{display:flex;gap:9px;align-items:flex-start;font-size:13.5px;line-height:1.4;}
.pv-check{width:18px;height:18px;border-radius:50%;background:#ffedd6;color:var(--ocre);font-size:11px;display:grid;place-items:center;flex-shrink:0;margin-top:1px;}
.pv-empty{font-size:12px;color:#a99fbb;font-style:italic;}
/* tool content section */
.pv-tcs{padding:6px 2px;}
.pv-tcs-title{font-weight:500;font-size:21px;color:#2d3e4d;text-align:center;line-height:1.12;}
.pv-tcs-sub{font-size:15px;color:var(--primary-500);text-align:center;margin-top:5px;}
/* faq */
.pv-faq{padding:4px 16px;}
.pv-faq-q{display:flex;gap:9px;align-items:center;font-size:13.5px;font-weight:500;padding:11px 0;border-bottom:1px solid #f0ecf6;color:#2d3e4d;}
.pv-faq-q:last-child{border-bottom:0;}
.pv-faq-q span{color:var(--violet);font-weight:700;}
/* video */
.pv-video{background:#1c1230;border-radius:20px;aspect-ratio:16/10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#fff;}
.pv-play{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.18);display:grid;place-items:center;font-size:15px;}
.pv-video-cap{font-size:12px;color:rgba(255,255,255,.8);}
/* form */
.pv-form-title{font-weight:500;}
.pv-field{background:#f6f1fb;border:1px solid #ebe2f8;border-radius:11px;padding:11px 13px;font-size:12.5px;color:#7a6f90;margin:8px 0 0;}
.pv-cta{background:var(--violet-700);color:#fff;border-radius:12px;padding:12px;text-align:center;font-weight:600;font-size:13.5px;margin-top:10px;}
/* card (conteneur) — card blanche imbriquant */
.pv-card-glass{background:#fff;border:1px solid #efe7f7;border-radius:22px;padding:16px;box-shadow:0 14px 32px -18px rgba(60,30,110,.45);}
.pv-card-title{font-weight:500;font-size:18px;color:#241a33;margin-bottom:12px;padding:0 2px;}
.pv-card-body{display:flex;flex-direction:column;gap:11px;}
.pv-card-body .pv-block{margin-bottom:0;}
.pv-card-body .pv-card-white{box-shadow:none;border:1px solid #eee3f6;}
/* conditional */
.pv-cond{display:flex;flex-direction:column;gap:11px;}
.pv-cond-chip{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;background:#efe7fb;border:1px dashed #cdb6f3;border-radius:999px;padding:5px 10px;font-size:11px;color:#6e1ed2;}
.pv-cond-rule{font-family:var(--ff-m);font-size:10px;}
.pv-cond-branch{font-weight:700;}
/* end */
.pv-end{text-align:center;font-family:var(--ff-m);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#a99fbb;padding:18px 0 8px;}

/* ---------- connected pane (mode branché) ---------- */
.conn{flex:1;display:flex;flex-direction:column;gap:12px;min-height:0;}
.conn-browser{border:1px solid var(--gline2);border-radius:14px;overflow:hidden;background:#0c0f15;}
.conn-bar{display:flex;align-items:center;gap:9px;padding:8px 11px;background:#11151d;border-bottom:1px solid var(--gline);}
.conn-dots{display:flex;gap:4px;}
.conn-dots i{width:8px;height:8px;border-radius:50%;background:#323b49;}
.conn-url{font-family:var(--ff-m);font-size:9.5px;color:var(--gmut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.conn-screen{padding:16px;}
.conn-status{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--gmut);font-family:var(--ff-m);margin-bottom:10px;}
.conn-off{width:8px;height:8px;border-radius:50%;background:#e0a23a;box-shadow:0 0 0 3px rgba(224,162,58,.2);}
.conn-expl{font-size:12px;color:var(--gmut);line-height:1.5;}
.conn-expl b{color:var(--gtext);}
.conn-log{flex:1;overflow-y:auto;border:1px solid var(--gline2);border-radius:14px;background:#0c0f15;padding:12px;min-height:0;}
.conn-log-h{font-family:var(--ff-m);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:8px;}
.conn-empty{font-size:12px;color:var(--gfaint);}
.conn-msg{font-family:var(--ff-m);font-size:10.5px;line-height:1.45;color:#a9e3c6;background:#080a0e;border:1px solid var(--gline);border-radius:8px;padding:8px 10px;margin:0 0 7px;white-space:pre-wrap;word-break:break-word;}
.conn-note{font-size:11px;color:var(--gfaint);line-height:1.45;}

/* ---------- modals ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(5,7,11,.72);backdrop-filter:blur(6px);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding-top:9vh;animation:fade .15s ease;}
@keyframes fade{from{opacity:0;}to{opacity:1;}}
.gallery-modal{width:660px;max-width:92vw;max-height:80vh;background:var(--g2);border:1px solid var(--gline2);border-radius:18px;box-shadow:0 40px 90px -30px rgba(0,0,0,.9);overflow:hidden;display:flex;flex-direction:column;}
.gm-head{display:flex;justify-content:space-between;align-items:flex-start;padding:20px 22px;border-bottom:1px solid var(--gline);}
.gm-title{font-family:var(--ff-d);font-weight:600;font-size:18px;color:#fff;}
.gm-sub{font-size:12.5px;color:var(--gmut);margin-top:3px;}
.gm-body{overflow-y:auto;padding:18px 22px 22px;}
.gm-cat{margin-bottom:18px;}
.gm-cat-l{font-family:var(--ff-m);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--gfaint);margin-bottom:9px;}
.gm-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.gm-item{background:var(--g3);border:1px solid var(--gline2);border-radius:12px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:7px;transition:border-color .12s, transform .12s;}
.gm-item:hover{border-color:var(--accent);transform:translateY(-2px);background:#212935;}
.gm-thumb{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,#9951fb,#6e1ed2);display:grid;place-items:center;font-size:17px;color:#fff;}
.gm-name{font-family:var(--ff-d);font-weight:600;font-size:14px;color:#fff;}
.gm-desc{font-size:11px;color:var(--gmut);line-height:1.4;}

.cmd{width:560px;max-width:92vw;background:var(--g2);border:1px solid var(--gline2);border-radius:16px;box-shadow:0 40px 90px -30px rgba(0,0,0,.9);overflow:hidden;}
.cmd-in{width:100%;background:transparent;border:0;border-bottom:1px solid var(--gline);padding:18px 20px;font-size:16px;color:#fff;font-family:var(--ff-b);}
.cmd-in:focus{outline:none;}
.cmd-list{max-height:50vh;overflow-y:auto;padding:8px;}
.cmd-sec{font-family:var(--ff-m);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--gfaint);padding:10px 10px 5px;}
.cmd-row{width:100%;display:flex;align-items:center;gap:11px;padding:9px 11px;border:0;background:transparent;color:var(--gtext);border-radius:9px;font-size:14px;text-align:left;}
.cmd-row:hover{background:rgba(179,136,255,.12);color:#fff;}
.cmd-glyph{width:24px;height:24px;border-radius:7px;background:var(--g3);display:grid;place-items:center;font-size:12px;color:var(--accent);flex-shrink:0;}
.cmd-empty{padding:24px;text-align:center;color:var(--gfaint);font-size:13px;}

.hint{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--g2);border:1px solid var(--gline2);border-radius:12px;padding:11px 18px;font-size:13px;color:var(--gtext);box-shadow:0 20px 50px -20px rgba(0,0,0,.7);z-index:60;display:flex;align-items:center;gap:14px;max-width:92vw;}
.hint b{color:var(--accent);}
.hint button{background:transparent;border:0;color:var(--gmut);font-size:16px;}

@media (max-width:1120px){
  .studio,.studio.no-device{grid-template-columns:60px minmax(0,1fr);}
  .rail-word,.rail-item span:last-child,.rail-sec,.rail-foot{display:none;}
  .rail-item{justify-content:center;}
  .device{display:none;}
}
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="data.js"></script>
<script type="text/babel" src="preview.jsx"></script>
<script type="text/babel" src="editor.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>

<script type="text/babel">
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "accent": "#b388ff",
  "density": "regular",
  "device": true,
  "previewMode": "Fac-similé"
}/*EDITMODE-END*/;

function Root(){
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [hint, setHint] = React.useState(true);
  React.useEffect(() => { document.documentElement.style.setProperty('--accent', t.accent); }, [t.accent]);
  return (
    <React.Fragment>
      <StudioApp tweaks={t} />
      {hint && (
        <div className="hint">
          <span>Essayez : ouvrez la <b>Card</b> ou le <b>Conditionnel</b>, <b>＋ Ajouter</b>, <b>glissez</b> pour réordonner, basculez l’aperçu en <b>Branché</b>. <b>⌘K</b> pour la palette.</span>
          <button onClick={() => setHint(false)}>✕</button>
        </div>
      )}
      <TweaksPanel>
        <TweakSection label="Accent (chrome de l’outil)" />
        <TweakColor label="Violet" value={t.accent}
          options={["#b388ff","#9951fb","#822eef","#cbb0ff"]}
          onChange={(v) => setTweak('accent', v)} />
        <TweakSection label="Aperçu" />
        <TweakRadio label="Source" value={t.previewMode}
          options={["Fac-similé","Branché"]}
          onChange={(v) => setTweak('previewMode', v)} />
        <TweakToggle label="Afficher l’aperçu" value={t.device}
          onChange={(v) => setTweak('device', v)} />
        <TweakSection label="Plan de travail" />
        <TweakRadio label="Densité" value={t.density}
          options={["compact","regular","comfy"]}
          onChange={(v) => setTweak('density', v)} />
      </TweaksPanel>
    </React.Fragment>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Root />);
</script>
<template id="__bundler_thumbnail">
  <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <rect width="100" height="100" fill="#0e1117"/>
    <rect x="30" y="30" width="40" height="40" rx="9" fill="#822eef"/>
    <text x="50" y="64" font-family="sans-serif" font-size="32" font-weight="700" fill="#fff" text-anchor="middle">M</text>
  </svg>
</template>
</body>
</html>
