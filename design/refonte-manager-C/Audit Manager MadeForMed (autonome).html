  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"bcd231d6-c22f-4469-b9d3-0c6c60fb0f19\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Space Grotesk';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"aa38501b-49c5-40da-a583-f0feea6f3703\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>/* ============================================================\n   Audit & refonte — Manager MadeForMed / Odaiji\n   Système éditorial. Violet de marque conservé (#822EEF).\n   Display: Space Grotesk · Texte: Hanken Grotesk · Méta/code: JetBrains Mono\n   ============================================================ */\n\n:root {\n  /* encre & papier — teinte légèrement violacée, froide */\n  --ink: #18151f;\n  --ink-2: #4b4658;\n  --ink-3: #7a7488;\n  --paper: #f4f2f7;\n  --paper-2: #ffffff;\n  --paper-3: #ece9f2;\n  --line: #ddd8e6;\n  --line-2: #c8c2d6;\n\n  /* violet de marque — primaire, sert à AGIR */\n  --violet: #822eef;\n  --violet-700: #6e1ed2;\n  --violet-900: #4e198a;\n  --violet-weak: #f1e7ff;\n  --violet-weak-2: #e5d4ff;\n\n  /* secondaires sémantiques (calqués sur la palette existante) */\n  --ocre: #c48000;\n  --ocre-weak: #fff1d8;\n  --rose: #e5271d;\n  --rose-weak: #ffe3e1;\n  --emerald: #2f7d4f;\n  --emerald-weak: #e3f3e9;\n\n  /* graphite (le rail actuel \"D·Studio\") */\n  --graphite: #11141b;\n  --graphite-2: #1b2029;\n  --graphite-line: #262d39;\n  --graphite-text: #c5ccd7;\n  --graphite-muted: #818a98;\n\n  --maxw: 1180px;\n  --radius: 16px;\n  --radius-sm: 10px;\n  --shadow: 0 1px 2px rgba(24, 21, 31, .05), 0 24px 60px -32px rgba(24, 21, 31, .28);\n  --shadow-sm: 0 1px 2px rgba(24, 21, 31, .06), 0 8px 22px -16px rgba(24, 21, 31, .22);\n\n  --ff-display: \"Space Grotesk\", system-ui, sans-serif;\n  --ff-body: \"Hanken Grotesk\", system-ui, sans-serif;\n  --ff-mono: \"JetBrains Mono\", ui-monospace, monospace;\n}\n\n* { box-sizing: border-box; }\nhtml { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }\nbody {\n  margin: 0;\n  background: var(--paper);\n  color: var(--ink);\n  font-family: var(--ff-body);\n  font-size: 17px;\n  line-height: 1.6;\n  letter-spacing: -0.005em;\n  -webkit-font-smoothing: antialiased;\n  text-rendering: optimizeLegibility;\n}\n\n/* paper grain / subtle texture */\nbody::before {\n  content: \"\";\n  position: fixed; inset: 0;\n  pointer-events: none;\n  z-index: 0;\n  background-image: radial-gradient(rgba(130, 46, 239, .03) 1px, transparent 1px);\n  background-size: 22px 22px;\n}\n\n.wrap { position: relative; z-index: 1; max-width: var(--maxw); margin: 0 auto; padding: 0 40px; }\n\n/* ---------- typography ---------- */\nh1, h2, h3, h4 { font-family: var(--ff-display); font-weight: 600; letter-spacing: -0.02em; line-height: 1.08; margin: 0; text-wrap: balance; }\np { margin: 0; text-wrap: pretty; }\n.eyebrow {\n  font-family: var(--ff-mono);\n  font-size: 12px;\n  font-weight: 500;\n  letter-spacing: 0.16em;\n  text-transform: uppercase;\n  color: var(--violet-700);\n}\n.lead { font-size: 21px; line-height: 1.5; color: var(--ink-2); letter-spacing: -0.01em; }\n.muted { color: var(--ink-2); }\n.faint { color: var(--ink-3); }\ncode, .mono { font-family: var(--ff-mono); font-size: 0.86em; }\n.code-chip {\n  font-family: var(--ff-mono); font-size: 0.8em;\n  background: var(--paper-3); border: 1px solid var(--line);\n  padding: 1px 6px; border-radius: 6px; color: var(--violet-700);\n  white-space: nowrap;\n}\n\n/* ---------- cover ---------- */\n.cover { padding: 96px 0 60px; border-bottom: 1px solid var(--line); }\n.cover-mark { display: inline-flex; align-items: center; gap: 12px; margin-bottom: 40px; }\n.mfm-square {\n  width: 38px; height: 38px; border-radius: 9px;\n  background: var(--violet); color: #fff;\n  display: inline-grid; place-items: center;\n  font-family: var(--ff-display); font-weight: 700; font-size: 20px;\n  box-shadow: 0 6px 18px -6px rgba(130, 46, 239, .6);\n}\n.mfm-mark-label { font-family: var(--ff-mono); font-size: 13px; letter-spacing: .04em; color: var(--ink-2); }\n.cover h1 { font-size: clamp(44px, 7vw, 86px); line-height: 0.98; margin-bottom: 28px; }\n.cover h1 em { font-style: normal; color: var(--violet); }\n.cover .lead { max-width: 720px; }\n.cover-meta {\n  display: flex; flex-wrap: wrap; gap: 40px;\n  margin-top: 52px; padding-top: 28px; border-top: 1px solid var(--line);\n}\n.cover-meta div { font-size: 14px; }\n.cover-meta dt { font-family: var(--ff-mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 5px; }\n.cover-meta dd { margin: 0; font-weight: 500; }\n\n/* ---------- section scaffolding ---------- */\nsection { padding: 80px 0; border-bottom: 1px solid var(--line); }\n.sec-head { display: flex; align-items: baseline; gap: 18px; margin-bottom: 14px; }\n.sec-num {\n  font-family: var(--ff-mono); font-size: 14px; font-weight: 500;\n  color: var(--violet); letter-spacing: .05em;\n  border: 1px solid var(--violet-weak-2); background: var(--violet-weak);\n  padding: 4px 9px; border-radius: 7px; flex-shrink: 0;\n}\n.sec-head h2 { font-size: clamp(30px, 4vw, 46px); }\n.sec-intro { max-width: 760px; margin-bottom: 48px; font-size: 19px; color: var(--ink-2); line-height: 1.5; }\n\n/* ---------- problem cards (synthèse) ---------- */\n.problems { display: grid; gap: 20px; }\n.problem {\n  display: grid; grid-template-columns: 88px 1fr; gap: 28px;\n  background: var(--paper-2); border: 1px solid var(--line);\n  border-radius: var(--radius); padding: 34px 36px; box-shadow: var(--shadow-sm);\n  align-items: start;\n}\n.problem-num { font-family: var(--ff-display); font-size: 64px; font-weight: 600; color: var(--violet-weak-2); line-height: 0.8; letter-spacing: -0.04em; }\n.problem h3 { font-size: 26px; margin-bottom: 10px; }\n.problem p { color: var(--ink-2); font-size: 17px; }\n.problem .impact { margin-top: 16px; display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-family: var(--ff-mono); color: var(--rose); background: var(--rose-weak); padding: 5px 11px; border-radius: 999px; }\n.problem .quote { margin-top: 14px; padding-left: 16px; border-left: 3px solid var(--violet-weak-2); font-style: italic; color: var(--ink-2); font-size: 16px; }\n\n/* ---------- generic two-col ---------- */\n.cols-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }\n.cols-2-7-5 { display: grid; grid-template-columns: 1.4fr 1fr; gap: 40px; align-items: start; }\n\n/* ---------- annotated mock frame ---------- */\n.figure { margin: 0; }\n.figure-cap { display: flex; align-items: center; gap: 10px; font-family: var(--ff-mono); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 14px; }\n.figure-cap .tag-state { color: var(--rose); border: 1px solid var(--rose-weak); background: var(--rose-weak); padding: 2px 8px; border-radius: 6px; letter-spacing: .06em; }\n.mock-shell {\n  position: relative;\n  border-radius: var(--radius); overflow: hidden;\n  border: 1px solid var(--line-2); background: var(--paper-2);\n  box-shadow: var(--shadow);\n}\n\n/* === recreate current \"D·Studio\" manager === */\n.win { display: grid; grid-template-columns: 200px 1fr; min-height: 560px; font-size: 13px; }\n.win-rail { background: var(--graphite); color: var(--graphite-text); padding: 0; display: flex; flex-direction: column; }\n.win-rail .rail-top { height: 46px; display: flex; align-items: center; gap: 9px; padding: 0 14px; border-bottom: 1px solid var(--graphite-line); }\n.win-rail .rail-sq { width: 24px; height: 24px; border-radius: 6px; background: var(--violet); color: #fff; display: grid; place-items: center; font-family: var(--ff-display); font-weight: 700; font-size: 13px; }\n.win-rail .rail-sec { font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: #6a7382; padding: 16px 14px 6px; }\n.rail-item { display: flex; align-items: center; gap: 9px; padding: 7px 14px; color: var(--graphite-text); position: relative; }\n.rail-item.active { background: rgba(140,90,235,.22); color: #fff; }\n.rail-item.active::before { content:\"\"; position: absolute; left: 0; top: 50%; transform: translateY(-50%); width: 3px; height: 18px; background: #b388ff; border-radius: 0 3px 3px 0; }\n.rail-dot { width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; font-weight: 600; font-size: 11px; color: #181b22; flex-shrink: 0; }\n\n.win-main { background: var(--paper); padding: 22px 24px; display: grid; grid-template-columns: 1fr 1fr; gap: 18px; min-width: 0; }\n.win-card { background: var(--paper-2); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow-sm); overflow: hidden; }\n.win-card-head { padding: 14px 16px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }\n.win-card-title { font-family: var(--ff-display); font-weight: 600; font-size: 15px; display: flex; align-items: center; gap: 7px; }\n.win-card-sub { font-size: 11px; color: var(--ink-3); margin-top: 3px; }\n.btn-primary { background: var(--violet-700); color: #fff; border: 0; border-radius: 9px; padding: 8px 13px; font-size: 12px; font-weight: 600; font-family: var(--ff-body); display: inline-flex; align-items: center; gap: 6px; box-shadow: 0 6px 16px -8px rgba(110,30,210,.7); }\n.btn-outline { background: var(--paper-2); border: 1px solid var(--line-2); border-radius: 8px; padding: 5px 9px; font-size: 11px; color: var(--ink-2); display: inline-flex; align-items: center; gap: 5px; }\n\n/* var(--graphite-line); border-radius: 10px; padding: 8px 14px; font-size: 12px; color: var(--graphite-muted); display: flex; align-items: center; gap: 10px; width: 300px; }\n.cC-kbd { font-family: var(--ff-mono); font-size: 10px; background: #11141b; border: 1px solid var(--graphite-line); border-radius: 5px; padding: 2px 6px; color: var(--graphite-text); margin-left: auto; }\n.cC-stack { display: grid; gap: 12px; }\n.cC-block { background: var(--graphite-2); border: 1px solid var(--graphite-line); border-radius: 13px; padding: 16px 18px; position: relative; }\n.cC-block.active { border-color: #b388ff; box-shadow: 0 0 0 1px #b388ff, 0 0 40px -10px rgba(179,136,255,.5); }\n.cC-eyebrow { font-family: var(--ff-mono); font-size: 9.5px; letter-spacing: .12em; text-transform: uppercase; color: #b388ff; }\n.cC-block h4 { color: #fff; font-size: 18px; margin: 7px 0 0; }\n.cC-thumb { width: 34px; height: 34px; border-radius: 8px; background: linear-gradient(135deg,#9951fb,#6e1ed2); flex-shrink: 0; }\n.cC-nest { margin-top: 12px; border: 1px solid var(--graphite-line); border-radius: 10px; background: #11141b; padding: 10px; }\n.cC-nest-h { font-family: var(--ff-mono); font-size: 9px; letter-spacing: .1em; text-transform: uppercase; color: #6a7382; margin-bottom: 8px; }\n.cC-subrow { display: flex; align-items: center; gap: 9px; padding: 8px 10px; background: var(--graphite-2); border: 1px solid var(--graphite-line); border-radius: 8px; margin-bottom: 6px; font-size: 12px; color: var(--graphite-text); }\n.cC-add { width: 100%; border: 1px dashed #4a3a6b; background: rgba(179,136,255,.08); color: #cbb0ff; border-radius: 8px; padding: 8px; font-size: 11px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 6px; }\n.deviceC { background: #11141b; border-left: 1px solid var(--graphite-line); padding: 22px 18px; }\n.deviceC-label { font-family: var(--ff-mono); font-size: 9.5px; letter-spacing: .1em; text-transform: uppercase; color: #6a7382; margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }\n.deviceC-screen { border-radius: 16px; overflow: hidden; border: 1px solid var(--graphite-line); aspect-ratio: 9/15; background: linear-gradient(180deg,#b480ff,#9951fb); position: relative; display: grid; place-items: center; }\n.deviceC-screen .dev-num { width: 38px; height: 38px; border-radius: 10px; background: var(--violet-900); transform: rotate(-4deg); display: grid; place-items: center; font-family: var(--ff-display); font-weight: 600; color: #fff; margin: 0 auto 10px; }\n.deviceC-screen h5 { color: #fff; font-size: 16px; text-align: center; padding: 0 18px; line-height: 1.15; }\n\n/* gallery picker (shared mini) */\n.gallery { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }\n.gal-item { border: 1px solid var(--line); border-radius: 9px; padding: 9px; text-align: center; background: var(--paper-2); }\n.gal-thumb { aspect-ratio: 4/3; border-radius: 6px; background: var(--violet-weak); margin-bottom: 7px; display: grid; place-items: center; color: var(--violet-700); font-size: 16px; }\n.gal-item .gal-name { font-size: 10.5px; font-weight: 600; }\n.gal-item .gal-hint { font-size: 9px; color: var(--ink-3); }\n\n/* ---------- comparison table ---------- */\n.cmp { width: 100%; border-collapse: collapse; font-size: 14px; background: var(--paper-2); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow-sm); }\n.cmp th, .cmp td { text-align: left; padding: 15px 18px; border-bottom: 1px solid var(--line); vertical-align: top; }\n.cmp thead th { font-family: var(--ff-mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); background: var(--paper-3); }\n.cmp td:first-child { font-weight: 600; }\n.cmp tr:last-child td { border-bottom: 0; }\n.cmp .yes { color: var(--emerald); font-weight: 600; }\n.cmp .mid { color: var(--ocre); }\n\n/* ---------- next steps ---------- */\n.steps { display: grid; gap: 14px; counter-reset: step; }\n.step { display: grid; grid-template-columns: 46px 1fr; gap: 20px; background: var(--paper-2); border: 1px solid var(--line); border-radius: var(--radius); padding: 24px 28px; align-items: start; box-shadow: var(--shadow-sm); }\n.step-n { width: 38px; height: 38px; border-radius: 10px; background: var(--violet); color: #fff; display: grid; place-items: center; font-family: var(--ff-display); font-weight: 600; font-size: 17px; }\n.step h4 { font-size: 18px; margin-bottom: 6px; }\n.step p { font-size: 14.5px; color: var(--ink-2); }\n.callout { border-left: 3px solid var(--ocre); background: var(--ocre-weak); border-radius: 0 12px 12px 0; padding: 18px 22px; margin-top: 24px; }\n.callout strong { color: var(--ocre); }\n.callout .ch { font-family: var(--ff-mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--ocre); display: block; margin-bottom: 8px; }\n\n/* footer */\n.foot { padding: 56px 0 80px; color: var(--ink-3); font-size: 13px; font-family: var(--ff-mono); display: flex; justify-content: space-between; gap: 20px; flex-wrap: wrap; }\n\n/* ---------- scaler : lock fixed-layout mocks to their design width and\n   scale-to-fit so pin coordinates + side panels stay valid at any width ---- */\n.scaler { width: 100%; overflow: hidden; }\n.scaler > .mock-shell { width: 1100px; transform-origin: top left; }\n\n/* responsive */\n@media (max-width: 980px) {\n  .wrap { padding: 0 24px; }\n  .cols-2, .cols-2-7-5, .principles, .dir-meta { grid-template-columns: 1fr; }\n  .story { grid-template-columns: 1fr 1fr; }\n  .problem { grid-template-columns: 1fr; gap: 14px; }\n  /* NB : the windowed mocks (#audit figure, dirA, dirC) keep their desktop\n     two-column layout — they are scaled, not reflowed (see .scaler). Only\n     the genuinely fluid blocks collapse here. */\n}\n@media (max-width: 560px) {\n  .story { grid-template-columns: 1fr; }\n}\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n<!-- ============================ COVER ============================ -->\n<header class=\"cover\">\n  <div class=\"wrap\">\n    <div class=\"cover-mark\">\n      <span class=\"mfm-square\">M<\u002Fspan>\n      <span class=\"mfm-mark-label\">Manager · MadeForMed / Odaiji<\u002Fspan>\n    <\u002Fdiv>\n    <p class=\"eyebrow\">Audit UX/UI &amp; direction visuelle<\u002Fp>\n    <h1>Éditer un parcours<br>sans éditer <em>à l'aveugle<\u002Fem>.<\u002Fh1>\n    <p class=\"lead\">Audit complet du CMS de parcours et trois directions de rupture pour que créer du contenu redevienne un geste visuel — pas un formulaire à remplir en espérant que le rendu suive.<\u002Fp>\n    <dl class=\"cover-meta\">\n      <div><dt>Périmètre<\u002Fdt><dd>Manager CMS (Next.js)<\u002Fdd><\u002Fdiv>\n      <div><dt>Cible<\u002Fdt><dd>Auteur non-expert<\u002Fdd><\u002Fdiv>\n      <div><dt>Contrainte<\u002Fdt><dd>Front &amp; schéma intacts<\u002Fdd><\u002Fdiv>\n      <div><dt>Livrable<\u002Fdt><dd>Audit + 3 directions<\u002Fdd><\u002Fdiv>\n      <div><dt>Date<\u002Fdt><dd>Juin 2026<\u002Fdd><\u002Fdiv>\n    <\u002Fdl>\n  <\u002Fdiv>\n<\u002Fheader>\n\n<!-- ============================ 00 CADRE ============================ -->\n<section id=\"cadre\">\n  <div class=\"wrap\">\n    <div class=\"sec-head\"><span class=\"sec-num\">00<\u002Fspan><h2>Le cadre<\u002Fh2><\u002Fdiv>\n    <p class=\"sec-intro\">Le manager sert à composer des parcours pédagogiques destinés aux médecins. Un chapitre = une pile de <em>blocs<\u002Fem> (hero, vidéo, texte, formulaire, condition…), certains pouvant contenir des <em>sous-blocs<\u002Fem>. Le front public restitue tout ça en scroll plein écran.<\u002Fp>\n    <div class=\"cols-2-7-5\">\n      <div>\n        <p class=\"muted\" style=\"margin-bottom:18px\">J'ai lu l'architecture réelle : <span class=\"code-chip\">ChapterEditor<\u002Fspan> (l'écran de travail), <span class=\"code-chip\">ChildBlockList<\u002Fspan> (les sous-blocs), <span class=\"code-chip\">AddBlockButton<\u002Fspan> (l'ajout) et les tokens « D·Studio ». L'audit qui suit ne juge pas le code — il juge ce que <em>vit l'auteur<\u002Fem> face à l'écran.<\u002Fp>\n        <p class=\"muted\">Trois faits structurent tout le reste : l'édition se fait dans des <strong>champs à gauche<\u002Fstrong>, le rendu dans une <strong>iframe à droite<\u002Fstrong> ; un « bloc » <strong>ne se comporte pas pareil<\u002Fstrong> selon sa profondeur ; et l'interface <strong>s'explique en prose<\u002Fstrong> au lieu de se montrer.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"dir-meta\" style=\"grid-template-columns:1fr;margin-top:0\">\n        <div class=\"box\">\n          <h5>Ce qui marche déjà<\u002Fh5>\n          <ul>\n            <li>Un brouillon vivant + publication par revue : solide.<\u002Fli>\n            <li>Le popover d'ajout montre un aperçu live du bloc — bonne intuition.<\u002Fli>\n            <li>Recherche exhaustive ⌘K, tags de maintenance, dark mode.<\u002Fli>\n          <\u002Ful>\n        <\u002Fdiv>\n        <div class=\"box watch\">\n          <h5>Ce qui coince<\u002Fh5>\n          <ul>\n            <li>L'auteur ne sait pas à quoi ressemblera son chapitre.<\u002Fli>\n            <li>Le geste « ajouter un sous-bloc » est confus et incohérent.<\u002Fli>\n            <li>Densité de texte et de jargon qui noie la décision.<\u002Fli>\n          <\u002Ful>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============================ 01 SYNTHÈSE ============================ -->\n<section id=\"synthese\">\n  <div class=\"wrap\">\n    <div class=\"sec-head\"><span class=\"sec-num\">01<\u002Fspan><h2>Trois problèmes racines<\u002Fh2><\u002Fdiv>\n    <p class=\"sec-intro\">Tout le reste découle de ces trois-là. Les régler, c'est régler 80 % du ressenti « je suis un peu perdu ».<\u002Fp>\n    <div class=\"problems\">\n\n      <article class=\"problem\">\n        <div class=\"problem-num\">01<\u002Fdiv>\n        <div>\n          <h3>L'auteur édite à l'aveugle<\u002Fh3>\n          <p>On tape dans des champs de formulaire à gauche ; le rendu vit dans une iframe séparée à droite, qu'il faut garder synchronisée à la main. Le code en dit long : des minuteries (<span class=\"code-chip\">1,2 s<\u002Fspan>, <span class=\"code-chip\">900 ms<\u002Fspan>) et trois drapeaux de garde empêchent les deux panneaux de « se battre » au scroll. Quand on règle ça par des minuteries, c'est que le modèle est faux : <em>édition<\u002Fem> et <em>rendu<\u002Fem> sont deux endroits au lieu d'un.<\u002Fp>\n          <p class=\"quote\">« Quand je crée du contenu, je reste un peu perdu sur le rendu final projeté. »<\u002Fp>\n          <span class=\"impact\">● Conséquence : pas de confiance dans le résultat<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Farticle>\n\n      <article class=\"problem\">\n        <div class=\"problem-num\">02<\u002Fdiv>\n        <div>\n          <h3>Le même objet, trois comportements<\u002Fh3>\n          <p>Un « bloc » se manipule différemment selon où il est. <strong>À la racine<\u002Fstrong> : glisser-déposer, tags, dupliquer, déplacer, badges. <strong>En sous-bloc<\u002Fstrong> : flèches ↑↓ (pas de drag), pas de tags, pas de dupliquer, et un accordéon qui n'ouvre qu'un élément à la fois. <strong>À l'ajout<\u002Fstrong>, encore un autre motif. L'auteur doit réapprendre les règles à chaque niveau de profondeur.<\u002Fp>\n          <span class=\"impact\">● Conséquence : charge mentale, gestes ratés<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Farticle>\n\n      <article class=\"problem\">\n        <div class=\"problem-num\">03<\u002Fdiv>\n        <div>\n          <h3>Tout se lit, rien ne se voit<\u002Fh3>\n          <p>Chaque ligne de bloc empile jusqu'à <strong>neuf signaux<\u002Fstrong> (numéro, chip de type en majuscules, résumé, pastille navbar, tags ou « ⚠ Sans tag », badge de diff, plus quatre boutons). Le vocabulaire est technique — « Tool content section », « Conditionnel », « Composant custom » — et chaque surface se double d'un paragraphe d'explication. On déchiffre l'interface au lieu de la parcourir.<\u002Fp>\n          <p class=\"quote\">« Trop de texte + une UX sortie de ma tête, et je ne suis pas un expert. »<\u002Fp>\n          <span class=\"impact\">● Conséquence : lenteur, hésitation, erreurs<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Farticle>\n\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============================ 02 AUDIT ANNOTÉ ============================ -->\n<section id=\"audit\">\n  <div class=\"wrap\">\n    <div class=\"sec-head\"><span class=\"sec-num\">02<\u002Fspan><h2>Audit annoté de l'écran actuel<\u002Fh2><\u002Fdiv>\n    <p class=\"sec-intro\">Reconstitution fidèle de l'éditeur de chapitre tel qu'il est aujourd'hui. Les pastilles renvoient aux constats détaillés sous la figure.<\u002Fp>\n\n    <figure class=\"figure\">\n      <figcaption class=\"figure-cap\">Éditeur de chapitre — état actuel <span class=\"tag-state\">tel quel<\u002Fspan><\u002Ffigcaption>\n      <div class=\"scaler\">\n      <div class=\"mock-shell\">\n        <!-- pins -->\n        <div class=\"pin\" style=\"top:26px;left:610px\">1<\u002Fdiv>\n        <div class=\"pin\" style=\"top:123px;left:612px\">2<\u002Fdiv>\n        <div class=\"pin\" style=\"top:260px;left:227px\">3<\u002Fdiv>\n        <div class=\"pin\" style=\"top:404px;left:227px\">4<\u002Fdiv>\n        <div class=\"pin\" style=\"top:26px;left:1048px\">5<\u002Fdiv>\n\n        <div class=\"win\">\n          <!-- graphite rail -->\n          <aside class=\"win-rail\">\n            <div class=\"rail-top\"><span class=\"rail-sq\">M<\u002Fspan><span style=\"font-weight:600;font-size:13px\">Manager<\u002Fspan><\u002Fdiv>\n            <div class=\"rail-sec\">Parcours<\u002Fdiv>\n            <div class=\"rail-item active\"><span class=\"rail-dot\" style=\"background:#c6a8f5\">D<\u002Fspan><span>Démo ventes<\u002Fspan><\u002Fdiv>\n            <div class=\"rail-item\"><span class=\"rail-dot\" style=\"background:#ffd8a5\">O<\u002Fspan><span>Onboarding<\u002Fspan><\u002Fdiv>\n            <div class=\"rail-item\"><span class=\"rail-dot\" style=\"background:#bdd9ff\">T<\u002Fspan><span>Téléconsult<\u002Fspan><\u002Fdiv>\n            <div style=\"margin-top:auto;padding:12px 14px;border-top:1px solid var(--graphite-line);font-size:10px;color:#6a7382;font-family:var(--ff-mono)\">vivien@madeformed.fr<\u002Fdiv>\n          <\u002Faside>\n\n          <!-- main: list + preview -->\n          <div class=\"win-main\">\n            <!-- left card: blocks -->\n            <div class=\"win-card\" style=\"align-self:start\">\n              <div class=\"win-card-head\">\n                <div>\n                  <div class=\"win-card-title\">▦ Blocs<\u002Fdiv>\n                  <div class=\"win-card-sub\">7 bloc(s). Clique sur un bloc pour l'éditer ici ; le panneau de droite suit.<\u002Fdiv>\n                  <div class=\"win-card-sub\" style=\"color:var(--ocre)\">🏷 3 blocs sans tag dans ce chapitre<\u002Fdiv>\n                <\u002Fdiv>\n                <button class=\"btn-primary\">+ Ajouter un bloc ⌄<\u002Fbutton>\n              <\u002Fdiv>\n              <div>\n                <div class=\"blk-row sel\">\n                  <span class=\"blk-grip\">⠿<\u002Fspan><span class=\"blk-chev\">▾<\u002Fspan><span class=\"blk-order\">0<\u002Fspan>\n                  <span class=\"blk-type\">Hero<\u002Fspan><span class=\"blk-sum\" style=\"font-weight:600\">Mieux gérer votre cabinet<\u002Fspan>\n                  <span class=\"blk-pill pill-tag\">🏷 V1<\u002Fspan><span class=\"blk-act\">⧉<\u002Fspan><span class=\"blk-act\">⤵<\u002Fspan><span class=\"blk-act del\">🗑<\u002Fspan>\n                <\u002Fdiv>\n                <div class=\"blk-row\">\n                  <span class=\"blk-grip\">⠿<\u002Fspan><span class=\"blk-chev\">▸<\u002Fspan><span class=\"blk-order\">1<\u002Fspan>\n                  <span class=\"blk-type\">Vidéo<\u002Fspan><span class=\"blk-sum\">vimeo/849213…<\u002Fspan>\n                  <span class=\"blk-pill pill-warn\">⚠ Sans tag<\u002Fspan><span class=\"blk-act\">⧉<\u002Fspan><span class=\"blk-act\">⤵<\u002Fspan><span class=\"blk-act del\">🗑<\u002Fspan>\n                <\u002Fdiv>\n                <div class=\"blk-row\">\n                  <span class=\"blk-grip\">⠿<\u002Fspan><span class=\"blk-chev\">▾<\u002Fspan><span class=\"blk-order\">2<\u002Fspan>\n                  <span class=\"blk-type\">Card<\u002Fspan><span class=\"blk-sum\">Conteneur · 2 sous-blocs<\u002Fspan>\n                  <span class=\"blk-pill pill-new\">Nouveau<\u002Fspan><span class=\"blk-act\">⧉<\u002Fspan><span class=\"blk-act\">⤵<\u002Fspan><span class=\"blk-act del\">🗑<\u002Fspan>\n                <\u002Fdiv>\n                <!-- nested sub-block region -->\n                <div class=\"subwrap\">\n                  <div class=\"subwrap-head\">children · sous-blocs<\u002Fdiv>\n                  <div class=\"sub-row\">\n                    <span class=\"blk-chev\">▸<\u002Fspan><span class=\"blk-type\">Texte<\u002Fspan><span class=\"blk-sum\">Un assistant qui décroche…<\u002Fspan>\n                    <span class=\"sub-arrows\">▲ ▼<\u002Fspan><span class=\"blk-act del\">🗑<\u002Fspan>\n                  <\u002Fdiv>\n                  <div class=\"sub-row added\">\n                    <span class=\"blk-chev\">▾<\u002Fspan><span class=\"blk-type\">Key points<\u002Fspan><span class=\"blk-sum\">Titre principal<\u002Fspan>\n                    <span class=\"sub-arrows\">▲ ▼<\u002Fspan><span class=\"blk-act del\">🗑<\u002Fspan>\n                  <\u002Fdiv>\n                  <div class=\"typebar\">\n                    <span class=\"type-btn\">+ Hero<\u002Fspan><span class=\"type-btn\">+ Vidéo<\u002Fspan><span class=\"type-btn\">+ Texte<\u002Fspan>\n                    <span class=\"type-btn\">+ Key points<\u002Fspan><span class=\"type-btn\">+ FAQ<\u002Fspan><span class=\"type-btn\">+ Card<\u002Fspan>\n                    <span class=\"type-btn\">+ Formulaire<\u002Fspan><span class=\"type-btn\">+ Conditionnel<\u002Fspan><span class=\"type-btn\">+ Tool content section<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n                <div class=\"blk-row\">\n                  <span class=\"blk-grip\">⠿<\u002Fspan><span class=\"blk-chev\">▸<\u002Fspan><span class=\"blk-order\">3<\u002Fspan>\n                  <span class=\"blk-type\">Formulaire<\u002Fspan><span class=\"blk-sum\">Pour une démo personnalisée<\u002Fspan>\n                  <span class=\"blk-pill pill-mod\">Modifié<\u002Fspan><span class=\"blk-act\">⧉<\u002Fspan><span class=\"blk-act\">⤵<\u002Fspan><span class=\"blk-act del\">🗑<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <!-- right card: preview iframe -->\n            <div class=\"win-preview\" style=\"align-self:start;min-height:430px\">\n              <div class=\"win-preview-bar\"><span>⟳ Aperçu<\u002Fspan><span>· brouillon<\u002Fspan><span style=\"margin-left:auto\">localhost:3100<\u002Fspan><\u002Fdiv>\n              <div class=\"win-preview-body\">\n                <div class=\"preview-hero\">\n                  <div class=\"pv-num\">1<\u002Fdiv>\n                  <h4>Mieux gérer<br>votre cabinet<\u002Fh4>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div class=\"win-preview-foot\"><span class=\"dot-iframe\"><span><\u002Fspan><span><\u002Fspan><span><\u002Fspan><\u002Fspan><span>iframe distante · re-fetch au reload<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Ffigure>\n\n    <!-- annotations -->\n    <div class=\"annot-list\" style=\"margin-top:30px\">\n      <div class=\"annot\">\n        <div class=\"annot-pin\">1<\u002Fdiv>\n        <div>\n          <h4>Le CTA d'ajout ouvre un panneau, qui ouvre un popover, qui contient une iframe <span class=\"sev sev-med\">Friction<\u002Fspan><\u002Fh4>\n          <p>Trois niveaux d'imbrication avant de poser un bloc. L'aperçu live (bonne idée) est enfoui dans une fenêtre de 420 px au lieu d'occuper la place de travail.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"annot\">\n        <div class=\"annot-pin\">2<\u002Fdiv>\n        <div>\n          <h4>Neuf signaux par ligne, tous de même poids <span class=\"sev sev-high\">Critique<\u002Fspan><\u002Fh4>\n          <p>Grip, chevron, numéro, chip de type, résumé, pastille, tag/« sans tag », badge de diff, et 3-4 actions. Rien ne hiérarchise : le titre du bloc se noie au milieu de la maintenance et des emojis (🏷 ⚠ 🗑).<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"annot\">\n        <div class=\"annot-pin\">3<\u002Fdiv>\n        <div>\n          <h4>Les sous-blocs sont un sous-monde aux règles différentes <span class=\"sev sev-high\">Critique<\u002Fspan><\u002Fh4>\n          <p>Réordonner se fait aux flèches ↑↓ (pas de drag comme à la racine), pas de tags, pas de dupliquer, accordéon à un seul ouvert, et l'étiquette technique « children · sous-blocs » fuite à l'écran. C'est le geste que vous avez pointé — il porte le maximum d'incohérence.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"annot\">\n        <div class=\"annot-pin\">4<\u002Fdiv>\n        <div>\n          <h4>La barre de types : un mur de 9-11 boutons en majuscules <span class=\"sev sev-med\">Friction<\u002Fspan><\u002Fh4>\n          <p>Aucune catégorie, aucune icône, du jargon brut. « Tool content section » et « Conditionnel » ont le même poids visuel que « Texte ». Un non-expert ne peut pas décider sans cliquer chacun.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"annot\">\n        <div class=\"annot-pin\">5<\u002Fdiv>\n        <div>\n          <h4>L'aperçu est un écran à part, à tenir synchronisé <span class=\"sev sev-high\">Critique<\u002Fspan><\u002Fh4>\n          <p>Iframe distante qui ne reflète en live que le bloc <em>actif<\u002Fem> ; le reste se recharge par à-coups. La relation « ce que je tape → ce que ça donne » est cassée. C'est la racine n°1.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============================ 03 PRINCIPES ============================ -->\n<section id=\"principes\">\n  <div class=\"wrap\">\n    <div class=\"sec-head\"><span class=\"sec-num\">03<\u002Fspan><h2>Cinq principes de refonte<\u002Fh2><\u002Fdiv>\n    <p class=\"sec-intro\">Le socle commun aux trois directions qui suivent. Indépendant du style : ce sont des règles de comportement, pas de couleur.<\u002Fp>\n    <div class=\"principles\">\n      <div class=\"principle\">\n        <div class=\"p-idx\">P1<\u002Fdiv>\n        <h3>Éditer sur le rendu, pas à côté<\u002Fh3>\n        <p>L'écran de travail montre le parcours tel qu'il sera. On clique un élément pour le modifier en place. L'aperçu n'est plus un second panneau à synchroniser : c'est la surface elle-même.<\u002Fp>\n        <div class=\"versus\"><span class=\"from\">— formulaire à gauche / iframe à droite<\u002Fspan><span class=\"to\">+ une seule surface, directe<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"principle\">\n        <div class=\"p-idx\">P2<\u002Fdiv>\n        <h3>Un seul modèle de bloc<\u002Fh3>\n        <p>Un bloc se manipule de la même façon partout : même geste de réordonnancement, même menu, même collapse — qu'il soit à la racine ou imbriqué à trois niveaux. La profondeur se voit, elle ne se réapprend pas.<\u002Fp>\n        <div class=\"versus\"><span class=\"from\">— drag à la racine, flèches en sous-bloc<\u002Fspan><span class=\"to\">+ un geste, toutes profondeurs<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"principle\">\n        <div class=\"p-idx\">P3<\u002Fdiv>\n        <h3>Montrer, pas décrire<\u002Fh3>\n        <p>Icônes, miniatures et aperçus remplacent les paragraphes d'aide et le jargon. Le type d'un bloc se reconnaît à sa forme. La maintenance (tags, diff) passe au second plan, à la demande.<\u002Fp>\n        <div class=\"versus\"><span class=\"from\">— « Tool content section » + 2 lignes d'aide<\u002Fspan><span class=\"to\">+ une vignette qui se reconnaît<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"principle\">\n        <div class=\"p-idx\">P4<\u002Fdiv>\n        <h3>Ajouter, c'est voir avant de poser<\u002Fh3>\n        <p>Un seul geste d'ajout, identique à tous les niveaux : un « + » à l'endroit exact, un menu catégorisé avec aperçu, l'élément se pose là où on l'a demandé et reçoit le focus. Fini les trois motifs concurrents.<\u002Fp>\n        <div class=\"versus\"><span class=\"from\">— panneau ▸ popover ▸ iframe<\u002Fspan><span class=\"to\">+ « + » contextuel ▸ pose immédiate<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"principle\">\n        <div class=\"p-idx\">P5<\u002Fdiv>\n        <h3>Le violet ne sert qu'à agir<\u002Fh3>\n        <p>On garde le <span class=\"code-chip\">#822EEF<\u002Fspan> de marque, mais réservé aux actions et à la sélection. Les neutres portent la structure. Une couleur = un sens : l'œil sait toujours où cliquer.<\u002Fp>\n        <div class=\"versus\"><span class=\"from\">— violet, ocre, ambre, emeraude partout<\u002Fspan><span class=\"to\">+ violet = action, le reste = neutre<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============================ 04 GESTE CLÉ ============================ -->\n<section id=\"geste\">\n  <div class=\"wrap\">\n    <div class=\"sec-head\"><span class=\"sec-num\">04<\u002Fspan><h2>Le geste clé, repensé<\u002Fh2><\u002Fdiv>\n    <p class=\"sec-intro\">Ajouter un sous-bloc dans une <em>Card<\u002Fem>, puis le replier — exactement le moment que vous avez pointé. Voici comment il se déroule après refonte, en quatre temps.<\u002Fp>\n    <div class=\"story\">\n\n      <div class=\"frame\">\n        <div class=\"frame-stage\">\n          <div class=\"mc mc-card\" style=\"top:30px\">\n            <div style=\"font-family:var(--ff-mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--violet-700)\">▦ Card<\u002Fdiv>\n            <div class=\"mc-sub\" style=\"margin-top:8px\">Texte — « Un assistant qui décroche… »<\u002Fdiv>\n            <div class=\"mc-plus\" style=\"margin-top:8px;width:100%;justify-content:center\">+ Ajouter dans cette card<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"frame-cap\">\n          <div class=\"frame-step\">TEMPS 1<\u002Fdiv>\n          <h4>Le « + » est dans la card<\u002Fh4>\n          <p>Pas une barre de 11 boutons en bas de page : un seul ajout, ancré à l'intérieur du conteneur visé.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"frame\">\n        <div class=\"frame-stage\">\n          <div class=\"mc mc-card\" style=\"top:24px\">\n            <div style=\"font-family:var(--ff-mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--violet-700)\">▦ Card<\u002Fdiv>\n            <div class=\"mc-sub\" style=\"margin-top:8px\">Texte<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"mc-menu\" style=\"top:96px;left:22px;right:22px\">\n            <div style=\"font-family:var(--ff-mono);font-size:9px;color:var(--ink-3);padding:3px 8px\">CONTENU<\u002Fdiv>\n            <div class=\"mc-menu-item\"><span class=\"mc-ico\">¶<\u002Fspan>Texte<\u002Fdiv>\n            <div class=\"mc-menu-item hi\"><span class=\"mc-ico\">◆<\u002Fspan>Key points<\u002Fdiv>\n            <div class=\"mc-menu-item\"><span class=\"mc-ico\">▦<\u002Fspan>FAQ<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"frame-cap\">\n          <div class=\"frame-step\">TEMPS 2<\u002Fdiv>\n          <h4>Un menu qui se reconnaît<\u002Fh4>\n          <p>Catégorisé, avec icônes et aperçu. On choisit « Key points » d'un coup d'œil, sans lire de définition.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"frame\">\n        <div class=\"frame-stage\">\n          <div class=\"mc mc-card\" style=\"top:30px\">\n            <div style=\"font-family:var(--ff-mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--violet-700)\">▦ Card<\u002Fdiv>\n            <div class=\"mc-sub\" style=\"margin-top:8px\">Texte<\u002Fdiv>\n            <div class=\"mc-sub\" style=\"margin-top:6px;border-style:solid;border-color:var(--violet);background:#fff;box-shadow:0 0 0 3px rgba(130,46,239,.15)\">\n              <div style=\"font-weight:600;color:var(--ink)\">◆ Key points — sélectionné<\u002Fdiv>\n              <div style=\"font-size:9px;color:var(--ink-3);margin-top:3px\">Édité en place · focus auto<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"frame-cap\">\n          <div class=\"frame-step\">TEMPS 3<\u002Fdiv>\n          <h4>Il se pose, ouvert, sélectionné<\u002Fh4>\n          <p>Le sous-bloc apparaît exactement dans la card, déjà ouvert et focalisé. Plus de chasse au « scroll + flash émeraude ».<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"frame\">\n        <div class=\"frame-stage\">\n          <div class=\"mc mc-card\" style=\"top:44px\">\n            <div style=\"font-family:var(--ff-mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--violet-700)\">▦ Card · 2 éléments<\u002Fdiv>\n            <div class=\"mc-sub mc-collapsed\" style=\"margin-top:8px\"><span class=\"mc-ico\">¶<\u002Fspan><span style=\"color:var(--ink)\">Texte<\u002Fspan><span style=\"margin-left:auto;color:var(--ink-3)\">▸<\u002Fspan><\u002Fdiv>\n            <div class=\"mc-sub mc-collapsed\" style=\"margin-top:6px\"><span class=\"mc-ico\">◆<\u002Fspan><span style=\"color:var(--ink)\">Key points<\u002Fspan><span style=\"margin-left:auto;color:var(--ink-3)\">▸<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"frame-cap\">\n          <div class=\"frame-step\">TEMPS 4<\u002Fdiv>\n          <h4>Replié = une ligne nette<\u002Fh4>\n          <p>Le collapse rend une barre compacte, icône + titre. La card se lit d'un coup ; on déplie ce qu'on veut, autant qu'on veut.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============================ 05 DIRECTIONS ============================ -->\n<section id=\"directions\">\n  <div class=\"wrap\">\n    <div class=\"sec-head\"><span class=\"sec-num\">05<\u002Fspan><h2>Trois directions visuelles<\u002Fh2><\u002Fdiv>\n    <p class=\"sec-intro\">Même écran, même geste, trois partis pris de rupture — tous ancrés sur le violet de marque. À choisir, ou à mixer (le canvas de A, la densité-type de B, la galerie d'icônes de C…).<\u002Fp>\n\n    <!-- DIRECTION A -->\n    <div class=\"dir dirA\">\n      <div class=\"dir-head\">\n        <div class=\"dir-tagline\"><span class=\"dir-letter\">A<\u002Fspan><h3>Canvas<\u002Fh3><\u002Fdiv>\n        <p class=\"dir-sub\">Le formulaire disparaît. L'écran de travail <em>est<\u002Fem> le parcours rendu. On clique un bloc, un inspecteur léger s'ouvre à droite ; les sous-blocs sont des cartes imbriquées <em>dans<\u002Fem> leur card, sur le canvas. Lumineux, aéré, le chrome s'efface.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"scaler\">\n      <div class=\"mock-shell\">\n        <div class=\"stage\">\n          <div class=\"canvasA\">\n            <div class=\"cA-hero\">\n              <div class=\"badge\">1<\u002Fdiv>\n              <h4>Mieux gérer votre cabinet<\u002Fh4>\n            <\u002Fdiv>\n            <div class=\"cA-block selected\">\n              <div class=\"cA-flag\">Sélectionné · Card<\u002Fdiv>\n              <div style=\"font-weight:600;font-size:15px\">Pourquoi ça change tout<\u002Fdiv>\n              <div class=\"cA-card-nest\">\n                <div class=\"cA-nest-label\">◆ Sous-blocs de la card<\u002Fdiv>\n                <div class=\"cA-subcard\"><span class=\"mc-ico\">¶<\u002Fspan>Texte — « Un assistant qui décroche… »<span style=\"margin-left:auto;color:var(--ink-3)\">▸<\u002Fspan><\u002Fdiv>\n                <div class=\"cA-subcard\" style=\"border-color:var(--violet);box-shadow:0 0 0 2px rgba(130,46,239,.12)\"><span class=\"mc-ico\">◆<\u002Fspan>Key points — Titre principal<span style=\"margin-left:auto;color:var(--ink-3)\">▾<\u002Fspan><\u002Fdiv>\n                <button class=\"cA-addnest\">+ Ajouter un sous-bloc<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <aside class=\"inspectorA\">\n            <div class=\"insp-eyebrow\">Inspecteur · Key points<\u002Fdiv>\n            <div class=\"insp-title\">Contenu<\u002Fdiv>\n            <div class=\"insp-field\"><label>Titre principal<\u002Flabel><div class=\"insp-input\">Titre principal<\u002Fdiv><\u002Fdiv>\n            <div class=\"insp-field\"><label>Points clés<\u002Flabel><div class=\"insp-input\" style=\"color:var(--ink-3)\">+ Ajouter un point<\u002Fdiv><\u002Fdiv>\n            <div class=\"insp-field\"><label>Variante<\u002Flabel><div class=\"insp-input\">Par défaut ⌄<\u002Fdiv><\u002Fdiv>\n          <\u002Faside>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"swatches\" aria-hidden=\"true\">\n        <span class=\"swatch\" style=\"background:#f6f4fb\"><\u002Fspan><span class=\"swatch\" style=\"background:#fff\"><\u002Fspan>\n        <span class=\"swatch\" style=\"background:var(--violet)\"><\u002Fspan><span class=\"swatch\" style=\"background:var(--violet-900)\"><\u002Fspan>\n        <span class=\"swatch\" style=\"background:#b480ff\"><\u002Fspan><span class=\"swatch\" style=\"background:var(--ink)\"><\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"dir-meta\">\n        <div class=\"box fix\">\n          <h5>Ce que ça règle<\u002Fh5>\n          <ul>\n            <li><strong>Racine n°1<\u002Fstrong> : on édite littéralement sur le rendu.<\u002Fli>\n            <li>Les sous-blocs vivent <em>dans<\u002Fem> leur card, visuellement.<\u002Fli>\n            <li>L'inspecteur isole un seul champ à la fois → moins de texte.<\u002Fli>\n          <\u002Ful>\n        <\u002Fdiv>\n        <div class=\"box watch\">\n          <h5>À surveiller<\u002Fh5>\n          <ul>\n            <li>Rendre les conteneurs invisibles (Conditionnel) cliquables.<\u002Fli>\n            <li>Le canvas doit refléter les variables du simulateur.<\u002Fli>\n            <li>Demande le plus de travail d'intégration côté front.<\u002Fli>\n          <\u002Ful>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- DIRECTION B -->\n    <div class=\"dir dirB\">\n      <div class=\"dir-head\">\n        <div class=\"dir-tagline\"><span class=\"dir-letter\">B<\u002Fspan><h3>Outline éditorial<\u002Fh3><\u002Fdiv>\n        <p class=\"dir-sub\">Le parcours comme un document structuré : une colonne unique, typographique. Chaque bloc est une ligne d'outline qu'on déplie au triangle, les sous-blocs s'indentent sous leur parent. Ajout par menu « / ». Papier chaud, hiérarchie portée par le <em>type<\u002Fem>, pas par les badges. La cure d'amaigrissement du « trop de texte ».<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"mock-shell\">\n        <div class=\"stage\">\n          <div class=\"outlineB\">\n            <div class=\"oB-eyebrow\">Chapitre 01 · Démo ventes<\u002Fdiv>\n            <div class=\"oB-h\">Mieux gérer votre cabinet<\u002Fdiv>\n\n            <div class=\"oB-line\">\n              <span class=\"oB-toggle\">▸<\u002Fspan><span class=\"oB-tick\">Hero<\u002Fspan>\n              <div class=\"oB-body\"><div class=\"t\">Mieux gérer votre cabinet<\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"oB-line\">\n              <span class=\"oB-toggle\">▸<\u002Fspan><span class=\"oB-tick\">Vidéo<\u002Fspan>\n              <div class=\"oB-body\"><div class=\"t\">Présentation — 1 min 40<\u002Fdiv><div class=\"d\">vimeo/849213<\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"oB-line\">\n              <span class=\"oB-toggle\">▾<\u002Fspan><span class=\"oB-tick\">Card<\u002Fspan>\n              <div class=\"oB-body\">\n                <div class=\"t\">Pourquoi ça change tout<\u002Fdiv>\n                <div class=\"oB-nest\">\n                  <div class=\"oB-subline\"><span class=\"oB-toggle\">▸<\u002Fspan><span class=\"oB-subtick\">Texte<\u002Fspan><span class=\"oB-sub-t\">Un assistant qui décroche le téléphone…<\u002Fspan><\u002Fdiv>\n                  <div class=\"oB-subline\"><span class=\"oB-toggle\">▾<\u002Fspan><span class=\"oB-subtick\">Key pts<\u002Fspan><span class=\"oB-sub-t\">Titre principal<\u002Fspan><\u002Fdiv>\n                  <div class=\"oB-slash\">\n                    <div class=\"q\">/ key…<\u002Fdiv>\n                    <div class=\"oB-slash-item\"><span class=\"oB-mini-ico\">¶<\u002Fspan>Texte<\u002Fdiv>\n                    <div class=\"oB-slash-item hi\"><span class=\"oB-mini-ico\">◆<\u002Fspan>Key points<\u002Fdiv>\n                    <div class=\"oB-slash-item\"><span class=\"oB-mini-ico\">▦<\u002Fspan>FAQ<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"oB-line\">\n              <span class=\"oB-toggle\">▸<\u002Fspan><span class=\"oB-tick\">Formulaire<\u002Fspan>\n              <div class=\"oB-body\"><div class=\"t\">Pour une démo personnalisée<\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"swatches\" aria-hidden=\"true\">\n        <span class=\"swatch\" style=\"background:#f3eee4\"><\u002Fspan><span class=\"swatch\" style=\"background:#fff\"><\u002Fspan>\n        <span class=\"swatch\" style=\"background:#2a2415\"><\u002Fspan><span class=\"swatch\" style=\"background:#a07c2e\"><\u002Fspan>\n        <span class=\"swatch\" style=\"background:var(--violet)\"><\u002Fspan><span class=\"swatch\" style=\"background:#e0d8c4\"><\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"dir-meta\">\n        <div class=\"box fix\">\n          <h5>Ce que ça règle<\u002Fh5>\n          <ul>\n            <li><strong>Le « trop de texte »<\u002Fstrong> : le type fait la hiérarchie, zéro badge superflu.<\u002Fli>\n            <li>L'imbrication se lit comme un plan : indentation = profondeur.<\u002Fli>\n            <li>Ajout par « / » : rapide, familier, sans quitter le clavier.<\u002Fli>\n          <\u002Ful>\n        <\u002Fdiv>\n        <div class=\"box watch\">\n          <h5>À surveiller<\u002Fh5>\n          <ul>\n            <li>L'aperçu visuel se fait dans un volet séparé (moins « WYSIWYG »).<\u002Fli>\n            <li>Maintenir un repère pour tags/diff sans réimporter le bruit.<\u002Fli>\n            <li>Le parti chaud s'éloigne le plus de l'actuel — assumer la rupture.<\u002Fli>\n          <\u002Ful>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- DIRECTION C -->\n    <div class=\"dir dirC\">\n      <div class=\"dir-head\">\n        <div class=\"dir-tagline\"><span class=\"dir-letter\">C<\u002Fspan><h3>Studio dark / command<\u002Fh3><\u002Fdiv>\n        <p class=\"dir-sub\">On assume le graphite du rail et on l'étend à tout l'espace. Outil pro, piloté au clavier (⌘K d'abord), violet luminescent en accent. Les blocs sont des « stacks » à forte typo, l'aperçu est un vrai device docké en permanence, et l'ajout passe par une galerie d'icônes — visuelle, pas textuelle.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"scaler\">\n      <div class=\"mock-shell\">\n        <div class=\"stage\">\n          <div class=\"canvasC\">\n            <div class=\"cC-topbar\">\n              <div style=\"font-family:var(--ff-display);font-weight:600;color:#fff;font-size:16px\">Démo ventes · Ch. 01<\u002Fdiv>\n              <div class=\"cC-cmd\">⌘ Ajouter, chercher, aller à…<span class=\"cC-kbd\">⌘K<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"cC-stack\">\n              <div class=\"cC-block\">\n                <div style=\"display:flex;gap:12px;align-items:center\"><span class=\"cC-thumb\"><\u002Fspan><div><div class=\"cC-eyebrow\">Hero<\u002Fdiv><h4>Mieux gérer votre cabinet<\u002Fh4><\u002Fdiv><\u002Fdiv>\n              <\u002Fdiv>\n              <div class=\"cC-block active\">\n                <div style=\"display:flex;gap:12px;align-items:center\"><span class=\"cC-thumb\"><\u002Fspan><div><div class=\"cC-eyebrow\">Card · active<\u002Fdiv><h4>Pourquoi ça change tout<\u002Fh4><\u002Fdiv><\u002Fdiv>\n                <div class=\"cC-nest\">\n                  <div class=\"cC-nest-h\">◆ Sous-blocs<\u002Fdiv>\n                  <div class=\"cC-subrow\"><span style=\"color:#b388ff\">¶<\u002Fspan>Texte — « Un assistant… »<span style=\"margin-left:auto;color:#6a7382\">▸<\u002Fspan><\u002Fdiv>\n                  <div class=\"cC-subrow\" style=\"border-color:#b388ff\"><span style=\"color:#b388ff\">◆<\u002Fspan>Key points — Titre principal<span style=\"margin-left:auto;color:#6a7382\">▾<\u002Fspan><\u002Fdiv>\n                  <button class=\"cC-add\">+ Sous-bloc<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div class=\"cC-block\">\n                <div style=\"display:flex;gap:12px;align-items:center\"><span class=\"cC-thumb\"><\u002Fspan><div><div class=\"cC-eyebrow\">Formulaire<\u002Fdiv><h4>Pour une démo personnalisée<\u002Fh4><\u002Fdiv><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <aside class=\"deviceC\">\n            <div class=\"deviceC-label\">⟳ Aperçu live · synchronisé<\u002Fdiv>\n            <div class=\"deviceC-screen\">\n              <div style=\"text-align:center\"><div class=\"dev-num\">1<\u002Fdiv><h5>Mieux gérer votre cabinet<\u002Fh5><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"margin-top:14px\"><div class=\"cC-nest-h\">Ajouter — galerie<\u002Fdiv>\n              <div class=\"gallery\" style=\"margin-top:8px\">\n                <div class=\"gal-item\" style=\"background:var(--graphite-2);border-color:var(--graphite-line)\"><div class=\"gal-thumb\" style=\"background:#241a36;color:#cbb0ff\">¶<\u002Fdiv><div class=\"gal-name\" style=\"color:#fff\">Texte<\u002Fdiv><\u002Fdiv>\n                <div class=\"gal-item\" style=\"background:var(--graphite-2);border-color:#b388ff\"><div class=\"gal-thumb\" style=\"background:#241a36;color:#cbb0ff\">◆<\u002Fdiv><div class=\"gal-name\" style=\"color:#fff\">Key pts<\u002Fdiv><\u002Fdiv>\n                <div class=\"gal-item\" style=\"background:var(--graphite-2);border-color:var(--graphite-line)\"><div class=\"gal-thumb\" style=\"background:#241a36;color:#cbb0ff\">▦<\u002Fdiv><div class=\"gal-name\" style=\"color:#fff\">FAQ<\u002Fdiv><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Faside>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"swatches\" aria-hidden=\"true\">\n        <span class=\"swatch\" style=\"background:var(--graphite)\"><\u002Fspan><span class=\"swatch\" style=\"background:var(--graphite-2)\"><\u002Fspan>\n        <span class=\"swatch\" style=\"background:#b388ff\"><\u002Fspan><span class=\"swatch\" style=\"background:var(--violet-700)\"><\u002Fspan>\n        <span class=\"swatch\" style=\"background:#cbb0ff\"><\u002Fspan><span class=\"swatch\" style=\"background:#fff\"><\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"dir-meta\">\n        <div class=\"box fix\">\n          <h5>Ce que ça règle<\u002Fh5>\n          <ul>\n            <li>Aperçu device <strong>toujours visible<\u002Fstrong> et synchronisé.<\u002Fli>\n            <li>Galerie d'icônes : choisir un type sans lire de jargon.<\u002Fli>\n            <li>Continuité directe avec le rail graphite « D·Studio » actuel.<\u002Fli>\n          <\u002Ful>\n        <\u002Fdiv>\n        <div class=\"box watch\">\n          <h5>À surveiller<\u002Fh5>\n          <ul>\n            <li>Contraste/accessibilité en tout-sombre (médecins, longues sessions).<\u002Fli>\n            <li>Le ⌘K-first suppose un onboarding minimal des raccourcis.<\u002Fli>\n            <li>Garder l'aperçu device fidèle aux breakpoints réels du front.<\u002Fli>\n          <\u002Ful>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- comparison -->\n    <h3 style=\"font-size:22px;margin:48px 0 18px\">D'un coup d'œil<\u002Fh3>\n    <table class=\"cmp\">\n      <thead>\n        <tr><th>Critère<\u002Fth><th>A · Canvas<\u002Fth><th>B · Outline<\u002Fth><th>C · Studio dark<\u002Fth><\u002Ftr>\n      <\u002Fthead>\n      <tbody>\n        <tr><td>Règle « édition à l'aveugle »<\u002Ftd><td class=\"yes\">Au plus fort<\u002Ftd><td class=\"mid\">Volet d'aperçu<\u002Ftd><td class=\"yes\">Device docké<\u002Ftd><\u002Ftr>\n        <tr><td>Règle « trop de texte »<\u002Ftd><td class=\"mid\">Bien<\u002Ftd><td class=\"yes\">Au plus fort<\u002Ftd><td class=\"yes\">Bien<\u002Ftd><\u002Ftr>\n        <tr><td>Proximité avec l'existant<\u002Ftd><td>Moyenne<\u002Ftd><td>Faible (rupture)<\u002Ftd><td class=\"yes\">Forte (rail repris)<\u002Ftd><\u002Ftr>\n        <tr><td>Effort d'intégration<\u002Ftd><td>Élevé<\u002Ftd><td class=\"yes\">Modéré<\u002Ftd><td>Moyen<\u002Ftd><\u002Ftr>\n        <tr><td>Tempérament<\u002Ftd><td>Clair, aéré, grand public<\u002Ftd><td>Chaud, rédactionnel, calme<\u002Ftd><td>Pro, dense, focus<\u002Ftd><\u002Ftr>\n      <\u002Ftbody>\n    <\u002Ftable>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============================ 06 NEXT ============================ -->\n<section id=\"next\" style=\"border-bottom:0\">\n  <div class=\"wrap\">\n    <div class=\"sec-head\"><span class=\"sec-num\">06<\u002Fspan><h2>Prochaines étapes<\u002Fh2><\u002Fdiv>\n    <p class=\"sec-intro\">Un chemin progressif, qui ne casse rien et se réintègre proprement dans Claude Code.<\u002Fp>\n    <div class=\"steps\">\n      <div class=\"step\">\n        <div class=\"step-n\">1<\u002Fdiv>\n        <div>\n          <h4>Choisir une direction (ou un mix)<\u002Fh4>\n          <p>Mon conseil : <strong>A · Canvas<\u002Fstrong> comme cible — c'est la réponse la plus directe à « je suis perdu sur le rendu ». On peut y greffer la <em>densité typographique<\u002Fem> de B et la <em>galerie d'icônes<\u002Fem> de C. Si l'on veut minimiser le risque d'intégration, démarrer par <strong>C<\u002Fstrong> (le rail graphite existe déjà).<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"step\">\n        <div class=\"step-n\">2<\u002Fdiv>\n        <div>\n          <h4>Unifier le modèle de bloc d'abord<\u002Fh4>\n          <p>Avant tout pixel : faire converger bloc racine et sous-bloc sur <strong>un seul composant<\u002Fstrong> (même drag, même menu, même collapse). C'est le gain le plus rentable et il est indépendant du style retenu.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"step\">\n        <div class=\"step-n\">3<\u002Fdiv>\n        <div>\n          <h4>Prototyper le geste clé, puis l'écran<\u002Fh4>\n          <p>Je peux transformer la direction choisie en <strong>prototype cliquable<\u002Fstrong> : ajouter un sous-bloc, le replier, le réordonner, voir le rendu suivre. On valide le ressenti avant d'écrire la moindre ligne dans le manager.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"step\">\n        <div class=\"step-n\">4<\u002Fdiv>\n        <div>\n          <h4>Réintégrer par couches, sans toucher au contrat<\u002Fh4>\n          <p>La refonte est purement présentation : on remplace la couche d'UI du manager sans modifier le rendu ni les données. Du low-risk au high-impact, écran par écran.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"callout\">\n      <span class=\"ch\">⚠ Garde-fous d'intégration<\u002Fspan>\n      <p>Tout est branché à un front. À <strong>ne pas toucher<\u002Fstrong> lors de la réintégration : le schéma partagé <span class=\"code-chip\">shared/content-schema.ts<\u002Fspan> (contrat front ↔ back), le protocole d'aperçu <span class=\"code-chip\">preview:setBlockOverride<\u002Fspan> &amp; consorts (postMessage), et le mécanisme brouillon/publication. La refonte vit <strong>au-dessus<\u002Fstrong> de ces contrats — elle ne les redéfinit pas.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<footer class=\"foot\">\n  <div class=\"wrap\" style=\"display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;width:100%\">\n    <span>Audit &amp; refonte — Manager MadeForMed / Odaiji<\u002Fspan>\n    <span>Document de travail · Juin 2026<\u002Fspan>\n  <\u002Fdiv>\n<\u002Ffooter>\n\n\n\n<script>\n  // Lock the fixed-layout mocks to their 1100px design width and scale them\n  // to fit any viewport — keeps pin coordinates and side panels valid instead\n  // of reflowing them out of place.\n  (function () {\n    function fit() {\n      document.querySelectorAll('.scaler').forEach(function (s) {\n        var inner = s.querySelector('.mock-shell');\n        if (!inner) return;\n        var dw = 1100;\n        var scale = Math.min(1, s.clientWidth / dw);\n        inner.style.transform = 'scale(' + scale + ')';\n        s.style.height = (inner.offsetHeight * scale) + 'px';\n      });\n    }\n    window.addEventListener('resize', fit);\n    window.addEventListener('load', fit);\n    if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);\n    fit();\n  })();\n<\u002Fscript>\n\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
