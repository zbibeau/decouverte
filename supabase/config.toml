# =====================================================================
# Supabase local stack configuration
# =====================================================================
# Brought up with `pnpm supabase:start` (alias for `supabase start`).
# Migrations under ./migrations/ are auto-applied on first start. Data
# from `./seed.sql` (if present) is loaded after the migrations.
# =====================================================================

# A short slug for this project. Used as the prefix for Docker container
# names so multiple Supabase stacks can coexist on the same machine.
project_id = "demo-ventes"

[api]
enabled = true
port = 54321
# Schemas exposed via the REST + GraphQL APIs.
schemas = ["public", "storage", "graphql_public"]
# Extra schemas resolved for foreign keys when querying via PostgREST.
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
# Major version — keep aligned with the cloud project (Supabase Pro
# defaults to 15). Update both at the same time when bumping.
major_version = 15

[db.seed]
# Files loaded after migrations on `supabase db reset`, in order:
#   1. `seed_wipe.sql` → clears the rows inserted by the seed migrations
#      (0003/0005/…) so the cloud dump can load without unique-key clashes.
#   2. `seed.sql` → cloud dump (regenerated by `supabase db dump …`).
#   3. `seed_dev_users.sql` → local admin user that survives resets.
enabled = true
sql_paths = ["./seed_wipe.sql", "./seed.sql", "./seed_dev_users.sql"]

[studio]
enabled = true
port = 54323
# Studio web UI lives at http://localhost:54323
api_url = "http://localhost:54321"

# Local inbox for emails sent by GoTrue (signup confirmations, magic
# links, password resets). Open http://localhost:54324 to read them.
[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3200"
# After-signup redirects allowed (the manager + Solid client both run on
# the host machine). Add staging/prod URLs here only if you bring local
# auth into prod-grade flows.
additional_redirect_urls = ["http://localhost:3100", "http://localhost:3200"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false   # local dev: skip the email step

[analytics]
enabled = false
